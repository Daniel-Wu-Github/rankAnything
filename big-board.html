<!DOCTYPE html>
<!-- // AD PLACEMENTS: See .ad-placeholder divs — replace inner content with your ad network tags. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Big Board 2026</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap"
    />
    <style>
      /* === DESIGN TOKENS === */
      [data-theme="dark"] {
        --bg: #0d1017;
        --bg-soft: #111620;
        --panel: #141923;
        --panel-strong: #1a2030;
        --text: #edf1f7;
        --muted: #8a96b0;
        --accent: #38bdf8;
        --accent-strong: #0ea5e9;
        --accent-tint: rgba(56, 189, 248, 0.12);
        --border: #2e3d58;
        --shadow: rgba(0, 0, 0, 0.4);
        --glow: rgba(251, 191, 36, 0.3);
        --danger: #f87171;
        --success: #34d399;
        --warning: #fbbf24;
        --amber: #f59e0b;
        --amber-tint: rgba(245, 158, 11, 0.15);
        --qb-full: #f87171; --qb-tint: rgba(248, 113, 113, 0.14);
        --rb-full: #34d399; --rb-tint: rgba(52, 211, 153, 0.14);
        --wr-full: #60a5fa; --wr-tint: rgba(96, 165, 250, 0.14);
        --te-full: #fb923c; --te-tint: rgba(251, 146, 60, 0.14);
        --dst-full: #a78bfa; --dst-tint: rgba(167, 139, 250, 0.14);
        --k-full: #f472b6;  --k-tint: rgba(244, 114, 182, 0.14);
        --unk-full: #94a3b8; --unk-tint: rgba(148, 163, 184, 0.14);
        --r-sm: 6px;
        --r-lg: 12px;
      }

      [data-theme="light"] {
        --bg: #f0f4f8;
        --bg-soft: #e8edf3;
        --panel: #ffffff;
        --panel-strong: #f5f8fb;
        --text: #1a2233;
        --muted: #5a6780;
        --accent: #0284c7;
        --accent-strong: #0369a1;
        --accent-tint: rgba(2, 132, 199, 0.10);
        --border: #d1d9e6;
        --shadow: rgba(0, 0, 0, 0.12);
        --glow: rgba(217, 119, 6, 0.2);
        --danger: #dc2626;
        --success: #059669;
        --warning: #d97706;
        --amber: #d97706;
        --amber-tint: rgba(217, 119, 6, 0.12);
        --qb-full: #dc2626; --qb-tint: rgba(220, 38, 38, 0.10);
        --rb-full: #059669; --rb-tint: rgba(5, 150, 105, 0.10);
        --wr-full: #2563eb; --wr-tint: rgba(37, 99, 235, 0.10);
        --te-full: #ea580c; --te-tint: rgba(234, 88, 12, 0.10);
        --dst-full: #7c3aed; --dst-tint: rgba(124, 58, 237, 0.10);
        --k-full: #db2777;  --k-tint: rgba(219, 39, 119, 0.10);
        --unk-full: #64748b; --unk-tint: rgba(100, 116, 139, 0.10);
        --r-sm: 6px;
        --r-lg: 12px;
      }

      /* === RESET === */
      * {
        box-sizing: border-box;
      }

      /* === BODY === */
      body {
        margin: 0;
        font-family: "DM Sans", sans-serif;
        color: var(--text);
        background: var(--bg);
        min-height: 100vh;
        transition: background 0.2s ease, color 0.2s ease;
      }

      [data-theme="dark"] body {
        background: radial-gradient(
            1200px 500px at 15% -10%,
            rgba(56, 189, 248, 0.14),
            transparent 60%
          ),
          radial-gradient(
            900px 400px at 100% 0%,
            rgba(52, 211, 153, 0.09),
            transparent 55%
          ),
          linear-gradient(160deg, #0b0e14 0%, #0d1017 60%, #0f1220 100%);
      }

      /* === PAGE LAYOUT === */
      .page {
        display: grid;
        grid-template-columns: 160px minmax(0, 1fr) 160px;
        gap: 20px;
        padding: 24px;
        align-items: start;
      }

      .ad-column {
        position: sticky;
        top: 20px;
      }

      .ad-column.ad-left {
        grid-column: 1;
      }

      .ad-column.ad-right {
        grid-column: 3;
      }

      .ad-placeholder {
        border: 1px dashed var(--border);
        background: var(--panel);
        color: var(--muted);
        height: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-align: center;
        border-radius: var(--r-lg);
        opacity: 0.7;
      }

      .ad-placeholder.ad-banner {
        display: none;
        position: sticky;
        bottom: 0;
        height: 52px;
        width: 100%;
        z-index: 20;
        border-radius: 0;
        opacity: 1;
      }

      .app {
        grid-column: 2;
        min-width: 0; /* allow the track to shrink; wide table scrolls in .table-scroll instead of stretching the page */
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* === TOOLBAR === */
      .toolbar {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 14px 16px;
        box-shadow: 0 4px 16px var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .toolbar-top {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .toolbar-bottom {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .identity {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .title-area {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }

      .dirty-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
        display: none;
        flex-shrink: 0;
      }

      .dirty-indicator.active {
        display: inline-block;
      }

      .save-toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--surface2, #1e2130);
        color: var(--text-muted, #8b95b0);
        font-size: 12px;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid var(--border, #2a2f45);
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 200ms ease, transform 200ms ease;
        pointer-events: none;
        z-index: 9999;
      }

      .save-toast.visible {
        opacity: 1;
        transform: translateY(0);
      }

      @media (prefers-reduced-motion: reduce) {
        .save-toast { transition: none; }
      }

      /* Keyboard reorder: lifted row + screen-reader live region */
      .player-row.kb-lifted {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
        background: var(--accent-tint);
      }

      .player-row:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .search-zone {
        display: flex;
        gap: 8px;
        align-items: center;
        flex: 1 1 240px;
        min-width: 0;
      }

      .search-input {
        flex: 1 1 180px;
        min-width: 120px;
      }

      .mode-badge {
        white-space: nowrap;
        flex-shrink: 0;
        background: var(--accent-tint);
        color: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        display: none;
        font-family: "DM Sans", sans-serif;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .mode-badge.visible {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .mode-badge.filters-active {
        background: var(--amber-tint);
        color: var(--amber);
        border-color: var(--amber);
      }

      .actions-zone {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        margin-left: auto;
      }

      .theme-toggle {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: var(--r-sm);
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 15px;
        transition: border-color 0.15s ease, color 0.15s ease;
        flex-shrink: 0;
        font-family: "DM Sans", sans-serif;
      }

      .theme-toggle:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* === FORM ELEMENTS === */
      input,
      select,
      textarea,
      button,
      summary {
        font-family: "DM Sans", sans-serif;
      }

      input,
      select,
      textarea {
        background: var(--bg-soft);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        padding: 7px 10px;
        font-size: 14px;
      }

      input:focus,
      select:focus,
      textarea:focus,
      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* === BUTTONS === */
      .btn {
        background: var(--panel-strong);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
        white-space: nowrap;
      }

      .btn:hover {
        border-color: var(--accent);
      }

      .btn.primary {
        background: var(--accent);
        color: #04121c;
        border-color: transparent;
      }

      .btn.primary:hover {
        background: var(--accent-strong);
      }

      .btn.subtle {
        background: transparent;
        border-color: transparent;
      }

      .btn.subtle:hover {
        border-color: var(--border);
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn:disabled:hover {
        border-color: var(--border);
        background: var(--panel-strong);
      }

      /* === FILTERS === */
      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .position-filters {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }

      .position-btn {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
      }

      .position-btn[data-position="ALL"].active {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-tint);
      }

      .position-btn[data-position="QB"] { color: var(--qb-full); }
      .position-btn[data-position="RB"] { color: var(--rb-full); }
      .position-btn[data-position="WR"] { color: var(--wr-full); }
      .position-btn[data-position="TE"] { color: var(--te-full); }
      .position-btn[data-position="D/ST"] { color: var(--dst-full); }
      .position-btn[data-position="K"] { color: var(--k-full); }
      .position-btn[data-position="UNK"] { color: var(--unk-full); }

      .position-btn.active { border-color: currentColor; background: rgba(255,255,255,0.06); }
      .position-btn[data-position="QB"].active { background: var(--qb-tint); }
      .position-btn[data-position="RB"].active { background: var(--rb-tint); }
      .position-btn[data-position="WR"].active { background: var(--wr-tint); }
      .position-btn[data-position="TE"].active { background: var(--te-tint); }
      .position-btn[data-position="D/ST"].active { background: var(--dst-tint); }
      .position-btn[data-position="K"].active { background: var(--k-tint); }

      .filter-group {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }

      /* The Max input's label carries a duplicate, invisible field-name (see
         markup) purely to reserve the same vertical space as the Min
         label's visible one — see the mobile alignment fix below. On
         desktop it never renders at all. */
      .filter-group label .field-name[aria-hidden="true"] {
        display: none;
      }

      /* Filters drawer: on desktop the filter row stays always-visible (its
         native <details> ships `open` in markup and the toggle control below
         is hidden), so desktop behavior is unchanged. Below 600px the toggle
         becomes visible and JS closes the drawer by default (see
         initFiltersDrawer) so the board isn't pushed below the fold by an
         always-expanded filter block. */
      .filters-drawer {
        margin: 0;
      }

      .filters-drawer > summary {
        display: none;
      }

      .team-filter {
        position: relative;
      }

      .team-filter summary {
        list-style: none;
        cursor: pointer;
        padding: 7px 12px;
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        background: var(--bg-soft);
        font-size: 13px;
        font-weight: 600;
      }

      .team-filter summary::-webkit-details-marker {
        display: none;
      }

      .team-options {
        position: absolute;
        top: 40px;
        left: 0;
        background: var(--panel-strong);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 10px;
        min-width: 200px;
        max-height: 220px;
        overflow: auto;
        z-index: 10;
        box-shadow: 0 8px 24px var(--shadow);
      }

      .team-chip {
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--accent-tint);
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
      }

      /* === BANNER === */
      .banner {
        display: none;
        padding: 10px 14px;
        border-radius: var(--r-sm);
        border: 1px solid rgba(248, 113, 113, 0.3);
        background: rgba(248, 113, 113, 0.10);
        color: var(--danger);
        font-size: 13px;
      }

      .banner.active {
        display: block;
      }

      /* === BOARD === */
      .board {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 0;
        overflow: hidden;
        box-shadow: 0 4px 16px var(--shadow);
        animation: boardEnter 0.3s ease both;
      }

      /* Wide table scrolls horizontally inside its own region so it can never
         widen the page. Clips at the rounded board corners via overflow. */
      .table-scroll {
        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
        border-radius: var(--r-lg);
      }

      /* === TABLE === */
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }

      thead th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        padding: 12px 8px 10px;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 1;
      }

      thead th.sortable {
        cursor: pointer;
        user-select: none;
      }

      thead th.sortable:hover {
        color: var(--text);
      }

      thead th.sortable span {
        margin-left: 4px;
        font-size: 10px;
        color: var(--accent);
      }

      .col-handle {
        width: 40px;
        padding-left: 8px !important;
      }

      .col-rank,
      .col-pos-rank {
        font-family: "DM Mono", monospace;
        width: 52px;
      }

      tbody td.col-pos-rank {
        padding: 0 !important;
        text-align: center;
        font-family: "DM Mono", monospace;
        font-size: 11px;
        font-weight: 700;
      }

      td.pos-cell-qb  { background: var(--qb-tint);  color: var(--qb-full); }
      td.pos-cell-rb  { background: var(--rb-tint);  color: var(--rb-full); }
      td.pos-cell-wr  { background: var(--wr-tint);  color: var(--wr-full); }
      td.pos-cell-te  { background: var(--te-tint);  color: var(--te-full); }
      td.pos-cell-dst { background: var(--dst-tint); color: var(--dst-full); }
      td.pos-cell-k   { background: var(--k-tint);   color: var(--k-full); }
      td.pos-cell-unk { background: var(--unk-tint); color: var(--unk-full); }

      .col-name {
        min-width: 160px;
      }

      tbody tr {
        transition: background 0.12s ease;
      }

      tbody tr.player-row {
        height: 44px;
      }

      tbody tr.player-row:hover {
        background: var(--accent-tint);
      }

      tbody tr.player-row.starred {
        box-shadow: inset 2px 0 0 var(--warning), inset 0 0 0 1px rgba(251, 191, 36, 0.15);
      }

      tbody td {
        padding: 8px 8px;
        border-bottom: 1px solid var(--border);
        font-size: 15px;
        vertical-align: middle;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      /* === HANDLE CELL === */
      .handle-cell {
        width: 40px;
        padding: 2px 4px 2px 8px !important;
        vertical-align: middle;
        text-align: center;
      }

      .drag-handle {
        display: block;
        color: var(--muted);
        cursor: grab;
        font-size: 13px;
        user-select: none;
        opacity: 0.35;
        transition: opacity 0.12s ease;
        padding: 2px 0;
      }

      tbody tr.player-row:hover .drag-handle {
        opacity: 0.8;
      }

      tbody tr.player-row.drag-disabled .drag-handle {
        cursor: not-allowed;
        opacity: 0.12;
      }

      .tier-btn {
        display: block;
        width: 100%;
        font-size: 9px;
        font-weight: 700;
        padding: 2px 4px;
        border-radius: 3px;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
        transition: opacity 0.12s ease, color 0.12s ease, border-color 0.12s ease;
        line-height: 1.4;
        box-sizing: border-box;
      }

      .tier-add {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        opacity: 0;
      }

      tbody tr.player-row:hover .tier-add {
        opacity: 0.7;
      }

      tbody tr.player-row:hover .tier-add:hover {
        color: var(--accent);
        border-color: var(--accent);
        opacity: 1;
      }

      .tier-remove {
        border: 1px solid var(--accent);
        background: var(--accent-tint);
        color: var(--accent);
        opacity: 0.5;
      }

      tbody tr.player-row:hover .tier-remove {
        opacity: 1;
      }

      /* Tier line — replaces tier-break rows */
      tbody tr.player-row.has-tier-above td {
        border-top: 2px solid var(--accent);
      }

      tbody tr.player-row.pre-tier td {
        border-bottom: none;
      }

      /* === POSITION BADGE === */
      .pos-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 5px;
        border-radius: var(--r-sm);
        vertical-align: middle;
        margin-left: 6px;
        font-family: "DM Mono", monospace;
        letter-spacing: 0.03em;
        line-height: 1.4;
      }

      .pos-badge.qb  { background: var(--qb-tint);  color: var(--qb-full); }
      .pos-badge.rb  { background: var(--rb-tint);  color: var(--rb-full); }
      .pos-badge.wr  { background: var(--wr-tint);  color: var(--wr-full); }
      .pos-badge.te  { background: var(--te-tint);  color: var(--te-full); }
      .pos-badge.dst { background: var(--dst-tint); color: var(--dst-full); }
      .pos-badge.k   { background: var(--k-tint);   color: var(--k-full); }
      .pos-badge.unk { background: var(--unk-tint); color: var(--unk-full); }

      /* === DRAFTED === */
      tbody tr.player-row.drafted {
        opacity: 0.38;
      }

      tbody tr.player-row.drafted:hover {
        opacity: 0.55;
      }

      .draft-btn {
        font-size: 11px;
        font-weight: 600;
        padding: 3px 7px;
        border-radius: var(--r-sm);
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: border-color 0.12s ease, color 0.12s ease;
        white-space: nowrap;
        font-family: "DM Sans", sans-serif;
      }

      .draft-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      tbody tr.player-row.drafted .draft-btn {
        border-color: var(--success);
        color: var(--success);
        background: rgba(52, 211, 153, 0.1);
      }

      /* === CELLS === */
      .cell-muted {
        color: var(--muted);
        font-family: "DM Mono", monospace;
        font-size: 14px;
      }

      .name-cell {
        max-width: 200px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 700;
      }

      .team-cell {
        font-weight: 700;
      }

      .note-cell {
        color: var(--muted);
      }

      /* "More actions" column only exists for the mobile compact row
         (opens the player-actions modal for age/bye/draft/note/delete);
         the desktop table has those as their own columns already. */
      .more-cell {
        display: none;
      }

      .icon-btn {
        background: transparent;
        border: none;
        color: inherit;
        cursor: pointer;
        font-size: 15px;
        padding: 2px 5px;
        border-radius: var(--r-sm);
        line-height: 1;
      }

      .icon-btn:hover {
        color: var(--text);
      }

      .icon-btn.note-empty {
        opacity: 0.35;
      }

      .delete-btn {
        opacity: 0;
        transition: opacity 0.12s ease;
        color: var(--danger);
      }

      tbody tr.player-row:hover .delete-btn {
        opacity: 0.7;
      }

      tbody tr.player-row:hover .delete-btn:hover {
        opacity: 1;
      }

      .drag-disabled {
        opacity: 0.6;
      }

      .drag-hint {
        font-size: 12px;
        color: var(--muted);
        padding: 4px 8px;
      }

      .drop-before td {
        box-shadow: inset 0 2px 0 var(--accent);
      }

      .drop-after td {
        box-shadow: inset 0 -2px 0 var(--accent);
      }

      /* === EMPTY STATE === */
      .empty-state {
        padding: 48px 16px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }

      /* === MODALS === */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(9, 12, 18, 0.72);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }

      @supports (backdrop-filter: blur(1px)) {
        .modal-backdrop {
          backdrop-filter: blur(6px);
          background: rgba(9, 12, 18, 0.52);
        }
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal {
        width: min(520px, 92vw);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 20px;
        box-shadow: 0 20px 48px var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .modal-title {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .modal-actions {
        display: flex;
        gap: 8px;
        justify-content: space-between;
        align-items: center;
      }

      .modal-actions-end {
        display: flex;
        gap: 8px;
      }

      /* Player "more actions" modal (mobile row overflow) */
      .player-actions-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .player-actions-stats > div {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 15px;
        font-weight: 600;
      }

      .player-actions-stats .field-name {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }

      .player-actions-buttons {
        flex-direction: column;
        align-items: stretch;
      }

      .player-actions-buttons .btn {
        width: 100%;
        min-height: 44px;
      }

      /* Add player 2-col grid */
      #add-player-form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      #add-player-form .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      #add-player-form label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
      }

      #add-player-form label .field-name {
        display: block;
        margin-bottom: 2px;
      }

      #add-player-form input,
      #add-player-form select {
        width: 100%;
      }

      /* === ANIMATIONS === */
      @keyframes boardEnter {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: none; }
      }

      @keyframes rowEnter {
        from { opacity: 0; transform: translateX(-6px); }
        to   { opacity: 1; transform: none; }
      }

      .row-enter {
        animation: rowEnter 0.2s ease both;
      }

      /* === RESPONSIVE === */
      @media (max-width: 980px) {
        .page {
          grid-template-columns: 1fr;
        }

        /* Ad columns are hidden here, so the desktop `.app { grid-column: 2 }`
           pin (which keeps the board in the middle track on desktop) would
           misplace the board into a phantom column 2. Reset it to the single
           remaining track. */
        .app {
          grid-column: 1;
        }

        .ad-column {
          display: none;
        }

        .ad-placeholder.ad-banner {
          display: flex;
        }
      }

      @media (max-width: 768px) {
        .toolbar-top {
          flex-direction: column;
          align-items: stretch;
          flex-wrap: nowrap; /* a wrapping column flex sizes to content width; force a single column */
        }

        .actions-zone {
          margin-left: 0;
        }

        /* In the stacked (column) toolbar, search-zone's `flex: 1 1 240px`
           basis applies to the main (vertical) axis, ballooning it to 240px
           tall. Reset to content height. */
        .search-zone {
          flex: 0 0 auto;
        }

        .toolbar-bottom {
          flex-direction: column;
          align-items: stretch;
          flex-wrap: nowrap; /* a wrapping column flex sizes to content width; force a single column */
          min-width: 0; /* flex item: don't inherit the chip strip's min-content width */
        }

        .position-filters {
          overflow-x: auto;
          white-space: nowrap;
          flex-wrap: nowrap;
          -webkit-overflow-scrolling: touch;
          min-width: 0; /* let the nowrap chip strip scroll instead of forcing the toolbar wider than the viewport */
        }

        #add-player-form .form-grid {
          grid-template-columns: 1fr;
        }
      }

      /* === MOBILE CARD COLLAPSE ===
         At phone widths the 10-column table can't fit, so each row becomes a
         labeled card (name = title, secondary fields as key/value pairs). No
         horizontal scroll; every field reachable by vertical scroll only. */
      @media (max-width: 600px) {
        .table-scroll {
          overflow-x: visible;
        }

        /* Filters collapse behind a tappable "Filters" row so the board
           isn't pushed below the fold by an always-open filter block. */
        .filters-drawer > summary {
          display: flex;
          align-items: center;
          gap: 6px;
          list-style: none;
          cursor: pointer;
          min-height: 44px;
          padding: 11px 14px;
          border: 1px solid var(--border);
          border-radius: var(--r-sm);
          background: var(--bg-soft);
          font-size: 14px;
          font-weight: 600;
        }

        .filters-drawer > summary::-webkit-details-marker {
          display: none;
        }

        .filters-count {
          background: var(--accent-tint);
          color: var(--accent);
          border-radius: 999px;
          padding: 1px 8px;
          font-size: 12px;
          font-weight: 700;
        }

        .filters-chevron {
          margin-left: auto;
          transition: transform 0.2s ease;
        }

        .filters-drawer[open] > summary .filters-chevron {
          transform: rotate(180deg);
        }

        .filters-drawer .toolbar-bottom {
          margin-top: 10px;
        }

        table,
        tbody {
          display: block;
          width: 100%;
        }

        thead {
          display: none;
        }

        /* One dense row per player — rank, name, team, star, drag handle,
           and a "more" button that opens the existing modal component for
           the secondary fields (age/bye/pos-rank/draft/note/delete). A
           labeled multi-line card was too tall to scan a board on a phone
           (only 1-2 players visible per screen); this fits ~10. */
        /* Divided-list style (not individual bordered cards) — a card per
           row with margins/border/radius couldn't shrink below ~54-58px
           without crowding the 44px controls; a flat divider list hits the
           44px floor exactly, which is what gets ~10 rows on screen. */
        tbody tr.player-row {
          display: flex;
          align-items: center;
          gap: 6px;
          height: auto; /* override the fixed 44px table-row height */
          min-height: 44px;
          padding: 0 8px;
          margin: 0;
          border: none;
          border-bottom: 1px solid var(--border);
          background: var(--panel);
        }

        tbody {
          border: 1px solid var(--border);
          border-radius: var(--r-sm);
          overflow: hidden;
        }

        tr.player-row:last-child {
          border-bottom: none;
        }

        tr.player-row > td {
          padding: 0;
          border: none;
          font-size: 14px;
        }

        tr.player-row > td::before {
          content: none;
        }

        /* Secondary fields move into the "more actions" modal on mobile —
           still fully reachable, just not competing for row width. */
        td.col-pos-rank,
        td.team-cell,
        td.age-cell,
        td.bye-cell,
        td.draft-cell,
        td.note-cell {
          display: none;
        }

        /* Visual left-to-right order: more-info, rank, star, name, drag
           handle. Set via flex `order` only — DOM order (and the desktop
           table's column order) is untouched. */
        td.more-cell { order: 1; }
        td.col-rank { order: 2; }
        td.star-cell { order: 3; }
        td.name-cell { order: 4; }
        td.handle-cell { order: 5; }

        td.handle-cell,
        td.star-cell,
        td.more-cell {
          flex: 0 0 44px; /* desktop's fixed-width table columns (e.g. .handle-cell's 40px) would otherwise set this flex item's basis and shrink the 44px control inside it */
          width: 44px;
          padding: 0 !important; /* .handle-cell's desktop padding is !important; must out-rank it here too */
          display: flex;
          align-items: center;
          justify-content: center;
        }

        td.col-rank {
          flex: 0 0 auto;
          width: auto;
          color: var(--muted);
          font-size: 13px;
          text-align: right;
        }

        td.name-cell {
          flex: 1 1 auto;
          min-width: 0;
          display: flex;
          align-items: baseline;
          gap: 6px;
          font-size: 15px;
          font-weight: 700;
          overflow: hidden;
          white-space: nowrap;
          text-overflow: ellipsis;
        }

        /* Drag handle: on touch, only this target starts a reorder (see the
           touchstart guard), so swiping the row body scrolls the list. Sized
           a full 44x44 hit area (not just the glyph's ink width) — the row's
           horizontal budget has room for three 44px controls plus the name.
           The glyph is swapped to a hamburger (three horizontal bars) here,
           mobile-only, so it doesn't read as a second "more info" control —
           the shared span's own text (used by the desktop drag dots) is
           hidden and replaced with a ::after icon. */
        td.handle-cell .drag-handle {
          position: relative;
          font-size: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 44px;
          height: 44px;
        }

        td.handle-cell .drag-handle::after {
          content: "\2261"; /* ☰ */
          font-size: 18px;
          line-height: 1;
          opacity: 0.55;
        }

        td.handle-cell .tier-btn {
          display: none; /* hover-only affordance on desktop; reachable via the "more" modal on touch instead */
        }

        td.star-cell .icon-btn {
          width: 44px;
          height: 44px;
          font-size: 17px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
        }

        td.more-cell .more-btn {
          width: 44px;
          height: 44px;
          font-size: 18px;
          color: var(--muted);
          display: inline-flex;
          align-items: center;
          justify-content: center;
        }

        /* Tier break renders as a top accent border on the row */
        tr.player-row.has-tier-above {
          border-top: 2px solid var(--accent);
        }

        /* Drop indicators during a touch reorder */
        tr.player-row.drop-before {
          box-shadow: inset 0 3px 0 var(--accent);
        }

        tr.player-row.drop-after {
          box-shadow: inset 0 -3px 0 var(--accent);
        }
      }

      /* === SMALL-PHONE REFINEMENTS (<=480px) === */
      @media (max-width: 480px) {
        .page {
          padding: 10px;
        }

        .toolbar {
          padding: 10px;
          gap: 8px;
        }

        .toolbar-top,
        .toolbar-bottom {
          gap: 6px;
        }

        /* Action buttons: full-width tap targets, 3-up grid (keeps the
           toolbar to roughly a third of the screen so the board is visible
           without scrolling past it first). */
        .actions-zone {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 6px;
        }

        .actions-zone .btn {
          width: 100%;
          min-height: 44px;
          padding: 8px 4px;
          font-size: 12.5px;
        }

        /* Filter chips: 44px tap targets */
        .position-btn {
          min-height: 44px;
          padding: 6px 14px;
        }

        .team-filter summary {
          min-height: 44px;
          padding: 11px 14px;
        }

        /* Theme toggle sits in the 3-up grid like the other action buttons
           (not spanning full width) so it doesn't read as an empty bar; it
           just gets the same 44px hit area. */
        .actions-zone .theme-toggle {
          width: 100%;
          min-height: 44px;
        }

        .search-input {
          padding: 11px 12px;
          font-size: 16px; /* >=16px prevents iOS zoom-on-focus */
        }

        /* Keep Age/Bye min-max pairs inline (one row each) so the filter block
           stays compact rather than stacking into four rows. */
        .filter-group {
          gap: 6px;
        }

        /* Stack each label's field-name above its input. The Min label's
           name is visible; the Max label carries a same-text invisible one
           (see base CSS + markup) so both labels are the same height and
           the two inputs land on the same row instead of Min sitting a
           line lower than Max. */
        .filter-group label {
          flex: 1 1 0;
          min-width: 0;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 3px;
        }

        .filter-group label .field-name {
          font-size: 11px;
          font-weight: 600;
          color: var(--muted);
          text-transform: uppercase;
          letter-spacing: 0.05em;
        }

        .filter-group label .field-name[aria-hidden="true"] {
          display: block;
          visibility: hidden;
        }

        .filter-group input {
          width: 100%;
          min-width: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")

      function clonePlayers(players) {

      function normalizePlayers(players) {
        return players.map((player, index) => ({
          ...player,
          rank: index + 1,
        }));

      function serializePlayers(players) {
        return JSON.stringify(players);

      function updateDirtyFlag(forceSaved) {
        if (forceSaved) {
          APP_STATE.lastSavedSerialized = serializePlayers(APP_STATE.players);

        }
        if (!APP_STATE.lastSavedSerialized) {
          APP_STATE.lastSavedSerialized = serializePlayers(APP_STATE.players);
        }

            updateDirtyFlag(true);
            try {
              localStorage.setItem("bb_saved_players", JSON.stringify(APP_STATE.players));
            } catch (e) {}
            break;
          case "OPEN_MODAL":
            APP_STATE.ui.modal = action.payload;
            APP_STATE.ui.modalReturnFocus = document.activeElement;
            break;
          case "CLOSE_MODAL":
            APP_STATE.ui.modal = null;
            if (APP_STATE.ui.modalReturnFocus?.focus) {
              const target = APP_STATE.ui.modalReturnFocus;
              APP_STATE.ui.modalReturnFocus = null;
              setTimeout(() => target.focus(), 0);
            }
            break;
          case "SET_BANNER":
            APP_STATE.ui.banner = action.payload;
            break;
          default:
            break;
        }

        if (MUTATING_ACTIONS.has(action.type) || isUndo || isRedo) {
          updateDirtyFlag(false);
          try {
            localStorage.setItem("bb_saved_players", JSON.stringify(APP_STATE.players));
          } catch (e) {}
        }

        APP_EVENTS.dispatchEvent(
          new CustomEvent("state:change", { detail: action })
        );
        renderApp();
      }

      function isFilterActive() {
        const filters = APP_STATE.filters;
        return (
          filters.positions.length > 0 ||
          filters.teams.length > 0 ||
          filters.ageMin !== "" ||
          filters.ageMax !== "" ||
          filters.byeMin !== "" ||
          filters.byeMax !== "" ||
          filters.searchQuery.trim() !== ""
        );
      }

      function countActiveFilterGroups() {
        const filters = APP_STATE.filters;
        let count = 0;
        if (filters.positions.length > 0) count++;
        if (filters.teams.length > 0) count++;
        if (filters.ageMin !== "" || filters.ageMax !== "") count++;
        if (filters.byeMin !== "" || filters.byeMax !== "") count++;
        return count;
      }

      function renderFiltersDrawerBadge() {
        const count = countActiveFilterGroups();
        dom.filtersCount.hidden = count === 0;
        dom.filtersCount.textContent = String(count);
      }

      function isSortActive() {
        return !!APP_STATE.sort.key;
      }

      function computePositionRanks(players) {
        const counts = {};
        const map = {};
        for (const player of players) {
          const position = player.position;
          counts[position] = (counts[position] || 0) + 1;
          map[player.id] = `${position}${counts[position]}`;
        }
        return map;
      }

      function getDisplayValue(value) {
        if (
          value === null ||
          value === undefined ||
          value === "" ||
          value === 0 ||
          value === "0"
        ) {
          return "—";
        }
        return value;
      }

      function applyFilters(players) {
        const filters = APP_STATE.filters;
        return players.filter((player) => {
          if (
            filters.positions.length &&
            !filters.positions.includes(player.position)
          ) {
            return false;
          }
          if (filters.teams.length && !filters.teams.includes(player.team)) {
            return false;
          }
          if (filters.ageMin !== "") {
            const minAge = Number(filters.ageMin);
            if (!Number.isNaN(minAge) && player.age < minAge) {
              return false;
            }
          }
          if (filters.ageMax !== "") {
            const maxAge = Number(filters.ageMax);
            if (!Number.isNaN(maxAge) && player.age > maxAge) {
              return false;
            }
          }
          if (filters.byeMin !== "") {
            const minBye = Number(filters.byeMin);
            if (!Number.isNaN(minBye) && player.byeWeek < minBye) {
              return false;
            }
          }
          if (filters.byeMax !== "") {
            const maxBye = Number(filters.byeMax);
            if (!Number.isNaN(maxBye) && player.byeWeek > maxBye) {
              return false;
            }
          }
          if (filters.searchQuery.trim()) {
            const query = filters.searchQuery.trim().toLowerCase();
            if (!player.name.toLowerCase().includes(query)) {
              return false;
            }
          }
          return true;
        });
      }

      function applySort(players) {
        const sort = APP_STATE.sort;
        if (!sort.key) {
          return players;
        }
        const sorted = [...players].sort((a, b) => {
          let comparison = 0;
          switch (sort.key) {
            case "name":
              comparison = a.name.localeCompare(b.name);
              break;
            case "team":
              comparison = a.team.localeCompare(b.team);
              break;
            case "position":
              comparison = a.position.localeCompare(b.position);
              break;
            case "age":
              comparison = a.age - b.age;
              break;
            case "byeWeek":
              comparison = a.byeWeek - b.byeWeek;
              break;
            default:
              break;
          }
          return sort.direction === "asc" ? comparison : -comparison;
        });
        return sorted;
      }

      function getTeamList(players) {
        const set = new Set();
        players.forEach((player) => {
          if (player.team) {
            set.add(player.team);
          }
        });
        return Array.from(set).sort();
      }

      function buildPositionFilters() {
        const filters = APP_STATE.filters;
        const active = new Set(filters.positions);
        const buttons = [
          `<button class="position-btn ${
            active.size === 0 ? "active" : ""
          }" data-position="ALL">ALL</button>`,
        ];
        POSITIONS.filter((pos) => pos !== "UNK").forEach((position) => {
          buttons.push(
            `<button class="position-btn ${
              active.has(position) ? "active" : ""
            }" data-position="${position}">${position}</button>`
          );
        });
        dom.positionFilters.innerHTML = buttons.join("");
      }

      function buildTeamFilters() {
        const teams = getTeamList(APP_STATE.players);
        const selectedTeams = new Set(APP_STATE.filters.teams);
        dom.teamOptions.innerHTML = teams
          .map(
            (team) => `
          <label>
            <input type="checkbox" data-team="${escapeHtml(team)}" ${
              selectedTeams.has(team) ? "checked" : ""
            } />
            ${escapeHtml(team)}
          </label>
        `
          )
          .join("");

        dom.teamChips.innerHTML = Array.from(selectedTeams)
          .map((team) => `<span class="team-chip">${escapeHtml(team)}</span>`)
          .join("");
      }

      function updateSortIndicators() {
        document.querySelectorAll("thead th.sortable").forEach((th) => {
          const indicator = th.querySelector("span");
          if (APP_STATE.sort.key === th.dataset.sortKey) {
            indicator.textContent = APP_STATE.sort.direction === "asc" ? "^" : "v";
          } else {
            indicator.textContent = "";
          }
        });
      }

      function renderBanner() {
        if (APP_STATE.ui.banner) {
          dom.banner.textContent = APP_STATE.ui.banner;
          dom.banner.classList.add("active");
        } else {
          dom.banner.textContent = "";
          dom.banner.classList.remove("active");
        }
      }

      function renderDragHint() {
        if (isFilterActive() || isSortActive()) {
          dom.dragHint.textContent = "Clear sort/filter to reorder.";
        } else {
          dom.dragHint.textContent = "";
        }
      }

      function renderModeBadge() {
        const active = isFilterActive() || isSortActive();
        dom.clearFilters.classList.add("visible");
        dom.clearFilters.classList.toggle("filters-active", active);
        dom.clearFilters.textContent = active ? "✕ Clear Filters" : "⇋ Reorder";
        renderFiltersDrawerBadge();
      }

      // === MODULE 1: TABLE RENDERING ===
      function renderApp() {
        buildPositionFilters();
        buildTeamFilters();
        updateSortIndicators();
        renderBanner();
        renderDragHint();
        renderModeBadge();

        dom.searchInput.value = APP_STATE.filters.searchQuery;
        dom.ageMin.value = APP_STATE.filters.ageMin;
        dom.ageMax.value = APP_STATE.filters.ageMax;
        dom.byeMin.value = APP_STATE.filters.byeMin;
        dom.byeMax.value = APP_STATE.filters.byeMax;

        dom.undo.disabled = APP_STATE.history.undo.length === 0;
        dom.redo.disabled = APP_STATE.history.redo.length === 0;
        dom.dirtyIndicator.classList.toggle("active", APP_STATE.isDirty);

        const positionRanks = computePositionRanks(APP_STATE.players);
        const filtered = applyFilters(APP_STATE.players);
        const viewPlayers = applySort(filtered);
        const showTiers = !isFilterActive() && !isSortActive();

        if (APP_STATE.players.length === 0) {
          dom.tableBody.innerHTML = `
            <tr>
              <td colspan="10" class="empty-state">
                No players yet. Add a player or import a CSV to get started.
              </td>
            </tr>
          `;
          return;
        }

        if (viewPlayers.length === 0) {
          dom.tableBody.innerHTML = `
            <tr>
              <td colspan="10" class="empty-state">
                No players match your filters. <button class="btn" data-action="clear-filters">Clear Filters</button>
              </td>
            </tr>
          `;
          return;
        }

        const rows = [];
        viewPlayers.forEach((player, idx) => {
          const isDrafted = APP_STATE.ui.draftedIds.has(player.id);
          const isReorderLocked = isFilterActive() || isSortActive();
          const posCls = player.position.toLowerCase().replace("/", "");
          const isTierAbove = showTiers && player.tiersAbove;
          const nextPlayer = viewPlayers[idx + 1];
          const isPreTier = showTiers && nextPlayer && nextPlayer.tiersAbove;

          const tierControl = showTiers
            ? (player.tiersAbove
                ? `<button class="tier-btn tier-remove" data-action="remove-tier" data-id="${player.id}" data-no-drag aria-label="Remove tier break">×</button>`
                : `<button class="tier-btn tier-add" data-action="add-tier" data-id="${player.id}" data-no-drag aria-label="Add tier break above">+</button>`)
            : '';

          rows.push(`
            <tr
              class="player-row ${getPositionClass(player.position)} ${player.starred ? "starred" : ""} ${isDrafted ? "drafted" : ""} ${isReorderLocked ? "drag-disabled" : ""} ${isTierAbove ? "has-tier-above" : ""} ${isPreTier ? "pre-tier" : ""}"
              data-id="${player.id}"
              draggable="${!isReorderLocked}"
              tabindex="${isReorderLocked ? "-1" : "0"}"
              aria-label="${escapeHtml(player.name)}, rank ${player.rank}${isReorderLocked ? "" : ". Press Space to lift, arrow keys to move, Space to drop, Escape to cancel"}"
              title="${isReorderLocked ? "Clear sort/filter to reorder." : ""}"
            >
              <td class="handle-cell">
                ${tierControl}
                <span class="drag-handle" aria-hidden="true">&#8286;</span>
              </td>
              <td class="cell-muted col-rank" data-label="Rank">${player.rank}</td>
              <td class="col-pos-rank pos-cell-${posCls}" data-label="Pos">${positionRanks[player.id]}</td>
              <td class="star-cell" data-label="Star">
                <button
                  class="icon-btn"
                  data-action="star"
                  data-id="${player.id}"
                  aria-pressed="${player.starred}"
                  data-no-drag
                >${player.starred ? "★" : "☆"}</button>
              </td>
              <td class="name-cell col-name">
                ${escapeHtml(player.name)}<span class="pos-badge ${posCls}">${escapeHtml(player.position)}</span>
              </td>
              <td class="team-cell" data-label="Team">${escapeHtml(getDisplayValue(player.team))}</td>
              <td class="cell-muted age-cell" data-label="Age">${getDisplayValue(player.age)}</td>
              <td class="cell-muted bye-cell" data-label="Bye">${getDisplayValue(player.byeWeek)}</td>
              <td class="draft-cell" data-label="Draft">
                <button
                  class="draft-btn"
                  data-action="draft"
                  data-id="${player.id}"
                  data-no-drag
                  aria-pressed="${isDrafted}"
                >${isDrafted ? "Drafted" : "Draft"}</button>
              </td>
              <td class="note-cell" data-label="Note">
                <button
                  class="icon-btn ${player.note ? "" : "note-empty"}"
                  data-action="note"
                  data-id="${player.id}"
                  data-no-drag
                  title="${player.note ? "Edit note" : "Add note"}"
                >${player.note ? "📝" : "+"}</button>
                <button
                  class="icon-btn delete-btn"
                  data-action="delete"
                  data-id="${player.id}"
                  data-no-drag
                  aria-label="Delete player"
                >&times;</button>
              </td>
              <td class="more-cell" data-label="More">
                <button
                  class="icon-btn more-btn"
                  data-action="more"
                  data-id="${player.id}"
                  data-no-drag
                  aria-label="More actions for ${escapeHtml(player.name)}"
                >&#8942;</button>
              </td>
            </tr>
          `);
        });

        dom.tableBody.innerHTML = rows.join("");
      }

      function clearDropIndicators() {
        document
          .querySelectorAll(".drop-before, .drop-after")
          .forEach((row) => row.classList.remove("drop-before", "drop-after"));
      }

      function setDropIndicator(targetRow, position) {
        if (!targetRow) {
          return;
        }
        clearDropIndicators();
        targetRow.classList.add(position === "above" ? "drop-before" : "drop-after");
      }

      function findRowFromPoint(x, y) {
        const el = document.elementFromPoint(x, y);
        if (!el) {
          return null;
        }
        return el.closest("tr.player-row");
      }

      function reorderPlayers(draggedId, targetId, position) {
        if (!draggedId || !targetId || draggedId === targetId) {
          return;
        }
        const players = [...APP_STATE.players];
        const fromIndex = players.findIndex((player) => player.id === draggedId);
        const toIndex = players.findIndex((player) => player.id === targetId);
        if (fromIndex === -1 || toIndex === -1) {
          return;
        }
        const [moved] = players.splice(fromIndex, 1);
        const insertIndex =
          position === "above"
            ? toIndex
            : toIndex + (fromIndex < toIndex ? 0 : 1);
        players.splice(insertIndex, 0, moved);
        dispatch({ type: "REORDER", payload: players });
      }

      // === MODULE 2: DRAG AND DROP ===
      function initDragAndDrop() {
        dom.tableBody.addEventListener("dragstart", (event) => {
          const row = event.target.closest("tr.player-row");
          if (!row || isFilterActive() || isSortActive()) {
            return;
          }
          if (event.target.closest("[data-no-drag]")) {
            event.preventDefault();
            return;
          }
          APP_STATE.ui.drag.draggingId = row.dataset.id;
          event.dataTransfer.setData("text/plain", row.dataset.id);
          event.dataTransfer.effectAllowed = "move";
        });

        dom.tableBody.addEventListener("dragover", (event) => {
          if (!APP_STATE.ui.drag.draggingId) {
            return;
          }
          event.preventDefault();
          const row = event.target.closest("tr.player-row");
          if (!row) {
            return;
          }
          const rect = row.getBoundingClientRect();
          const position = event.clientY < rect.top + rect.height / 2 ? "above" : "below";
          APP_STATE.ui.drag.overId = row.dataset.id;
          APP_STATE.ui.drag.position = position;
          setDropIndicator(row, position);
        });

        dom.tableBody.addEventListener("drop", (event) => {
          event.preventDefault();
          const draggedId = APP_STATE.ui.drag.draggingId;
          const targetId = APP_STATE.ui.drag.overId;
          const position = APP_STATE.ui.drag.position;
          reorderPlayers(draggedId, targetId, position);
          APP_STATE.ui.drag.draggingId = null;
          APP_STATE.ui.drag.overId = null;
          APP_STATE.ui.drag.position = null;
          clearDropIndicators();
        });

        dom.tableBody.addEventListener("dragend", () => {
          APP_STATE.ui.drag.draggingId = null;
          APP_STATE.ui.drag.overId = null;
          APP_STATE.ui.drag.position = null;
          clearDropIndicators();
        });

        let touchState = null;

        dom.tableBody.addEventListener(
          "touchstart",
          (event) => {
            const row = event.target.closest("tr.player-row");
            if (!row || isFilterActive() || isSortActive()) {
              return;
            }
            if (event.target.closest("[data-no-drag]")) {
              return;
            }
            // Only the drag handle starts a touch reorder. A plain swipe
            // anywhere else on the row falls through to native scrolling,
            // so the list stays scrollable on touch devices.
            if (!event.target.closest(".drag-handle")) {
              return;
            }
            const touch = event.changedTouches[0];
            touchState = {
              id: row.dataset.id,
              startX: touch.clientX,
              startY: touch.clientY,
              active: false,
            };
          },
          { passive: true }
        );

        dom.tableBody.addEventListener(
          "touchmove",
          (event) => {
            if (!touchState) {
              return;
            }
            const touch = event.changedTouches[0];
            const delta = Math.abs(touch.clientY - touchState.startY);
            if (!touchState.active && delta > 8) {
              touchState.active = true;
              APP_STATE.ui.drag.draggingId = touchState.id;
            }
            if (touchState.active) {
              event.preventDefault();
              const row = findRowFromPoint(touch.clientX, touch.clientY);
              if (!row) {
                return;
              }
              const rect = row.getBoundingClientRect();
              const position =
                touch.clientY < rect.top + rect.height / 2 ? "above" : "below";
              APP_STATE.ui.drag.overId = row.dataset.id;
              APP_STATE.ui.drag.position = position;
              setDropIndicator(row, position);
            }
          },
          { passive: false }
        );

        dom.tableBody.addEventListener(
          "touchend",
          () => {
            if (touchState && touchState.active) {
              reorderPlayers(
                APP_STATE.ui.drag.draggingId,
                APP_STATE.ui.drag.overId,
                APP_STATE.ui.drag.position
              );
            }
            touchState = null;
            APP_STATE.ui.drag.draggingId = null;
            APP_STATE.ui.drag.overId = null;
            APP_STATE.ui.drag.position = null;
            clearDropIndicators();
          },
          { passive: true }
        );
      }

      // === MODULE 3: UNDO / REDO ===
      function initUndoRedo() {
        dom.undo.addEventListener("click", () => dispatch({ type: "UNDO" }));
        dom.redo.addEventListener("click", () => dispatch({ type: "REDO" }));

        document.addEventListener("keydown", (event) => {
          const isMac = navigator.platform.toLowerCase().includes("mac");
          const meta = isMac ? event.metaKey : event.ctrlKey;

          if (meta && event.key.toLowerCase() === "z" && !event.shiftKey) {
            event.preventDefault();
            dispatch({ type: "UNDO" });
            return;
          }
          if (
            (meta && event.key.toLowerCase() === "y") ||
            (meta && event.shiftKey && event.key.toLowerCase() === "z")
          ) {
            event.preventDefault();
            dispatch({ type: "REDO" });
            return;
          }
          if (meta && event.key.toLowerCase() === "e") {
            event.preventDefault();
            exportCsv();
            return;
          }
          if (event.key === "Escape") {
            dispatch({ type: "CLOSE_MODAL" });
          }
        });
      }

      // === MODULE 4: FILTERING AND SORTING ===
      function initFiltersAndSorting() {
        dom.positionFilters.addEventListener("click", (event) => {
          const button = event.target.closest("button");
          if (!button) {
            return;
          }
          const position = button.dataset.position;
          if (position === "ALL") {
            dispatch({ type: "SET_FILTERS", payload: { positions: [] } });
            return;
          }
          const current = new Set(APP_STATE.filters.positions);
          if (current.has(position)) {
            current.delete(position);
          } else {
            current.add(position);
          }
          dispatch({
            type: "SET_FILTERS",
            payload: { positions: Array.from(current) },
          });
        });

        dom.teamOptions.addEventListener("change", (event) => {
          const input = event.target.closest("input[data-team]");
          if (!input) {
            return;
          }
          const current = new Set(APP_STATE.filters.teams);
          if (input.checked) {
            current.add(input.dataset.team);
          } else {
            current.delete(input.dataset.team);
          }
          dispatch({
            type: "SET_FILTERS",
            payload: { teams: Array.from(current) },
          });
        });

        dom.searchInput.addEventListener("input", (event) => {
          dispatch({
            type: "SET_FILTERS",
            payload: { searchQuery: event.target.value },
          });
        });

        [dom.ageMin, dom.ageMax, dom.byeMin, dom.byeMax].forEach((input) => {
          input.addEventListener("input", () => {
            dispatch({
              type: "SET_FILTERS",
              payload: {
                ageMin: dom.ageMin.value,
                ageMax: dom.ageMax.value,
                byeMin: dom.byeMin.value,
                byeMax: dom.byeMax.value,
              },
            });
          });
        });

        dom.clearFilters.addEventListener("click", () => {
          dispatch({
            type: "SET_FILTERS",
            payload: {
              positions: [],
              teams: [],
              ageMin: "",
              ageMax: "",
              byeMin: "",
              byeMax: "",
              searchQuery: "",
            },
          });
          dispatch({ type: "SET_SORT", payload: { key: null, direction: "asc" } });
        });

        document.querySelectorAll("thead th.sortable").forEach((th) => {
          th.addEventListener("click", () => {
            const key = th.dataset.sortKey;
            if (APP_STATE.sort.key === key) {
              if (APP_STATE.sort.direction === "asc") {
                dispatch({
                  type: "SET_SORT",
                  payload: { key, direction: "desc" },
                });
              } else {
                dispatch({ type: "SET_SORT", payload: { key: null } });
              }
            } else {
              dispatch({
                type: "SET_SORT",
                payload: { key, direction: "asc" },
              });
            }
          });
        });
      }

      // === MODULE 5: TIER BREAKS ===
      function initTierBreaks() {
        dom.tableBody.addEventListener("click", (event) => {
          const addButton = event.target.closest(
            'button[data-action="add-tier"]'
          );
          const removeButton = event.target.closest(
            'button[data-action="remove-tier"]'
          );
          if (addButton) {
            dispatch({ type: "SET_TIER", payload: addButton.dataset.id });
            return;
          }
          if (removeButton) {
            dispatch({
              type: "REMOVE_TIER",
              payload: removeButton.dataset.id,
            });
          }
        });

        dom.tableBody.addEventListener("input", (event) => {
          const input = event.target.closest('input[data-action="tier-label"]');
          if (!input) {
            return;
          }
          dispatch({
            type: "SET_TIER_LABEL",
            payload: { id: input.dataset.id, label: input.value },
          });
        });
      }

      function trapFocus(modal) {
        if (modal.__trapHandler) {
          modal.removeEventListener("keydown", modal.__trapHandler);
        }
        const focusable = modal.querySelectorAll(
          "button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])"
        );
        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        modal.__trapHandler = (event) => {
          if (event.key !== "Tab") {
            return;
          }
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        };

        modal.addEventListener("keydown", modal.__trapHandler);

        if (first) {
          first.focus();
        }
      }

      // === MODULE 6: NOTE MODAL ===
      function initModal() {
        dom.modalBackdrop.addEventListener("click", (event) => {
          if (event.target === dom.modalBackdrop) {
            dispatch({ type: "CLOSE_MODAL" });
          }
        });

        dom.modalBackdrop.addEventListener("click", (event) => {
          const closeButton = event.target.closest(
            'button[data-action="close-modal"]'
          );
          if (closeButton) {
            dispatch({ type: "CLOSE_MODAL" });
          }
        });
      }

      function renderModal() {
        const modalState = APP_STATE.ui.modal;
        if (!modalState) {
          dom.modalBackdrop.classList.remove("open");
          dom.modalBackdrop.setAttribute("aria-hidden", "true");
          dom.modalContent.innerHTML = "";
          return;
        }

        dom.modalBackdrop.classList.add("open");
        dom.modalBackdrop.setAttribute("aria-hidden", "false");

        if (modalState.type === "note") {
          const player = APP_STATE.players.find(
            (candidate) => candidate.id === modalState.playerId
          );
          dom.modalTitle.textContent = player ? player.name : "Notes";
          dom.modalContent.innerHTML = `
            <textarea id="note-input" rows="6" placeholder="Add a note for this player…"></textarea>
            <div class="modal-actions">

      // === MODULE 7: CSV IMPORT / EXPORT ===
      function exportCsv() {
        const positionRanks = computePositionRanks(APP_STATE.players);
        const data = APP_STATE.players.map((player) => ({
          rank: player.rank,
          positionRank: positionRanks[player.id],
          name: player.name,
          position: player.position,
          team: player.team,
          age: player.age,
          byeWeek: player.byeWeek,
          starred: player.starred,
          note: player.note,
          tiersAbove: player.tiersAbove,
        }));

        const csv = Papa.unparse(data, {
          header: true,
          skipEmptyLines: true,
          escapeFormulae: true,
        });

        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "big-board-export.csv";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);

        updateDirtyFlag(true);
        renderApp();
        track("csv_export", { players: data.length });
      }

      function parseBoolean(value) {
        if (typeof value === "boolean") {
          return value;
        }
        if (typeof value === "string") {
          return ["true", "1", "yes"].includes(value.toLowerCase());
        }
        return false;
      }

      function normalizePosition(value) {
        if (!value) {
          return "UNK";
        }
        const trimmed = String(value).toUpperCase();
        return POSITIONS.includes(trimmed) ? trimmed : "UNK";
      }

      function initCsv() {
        dom.exportCsv.addEventListener("click", exportCsv);
        dom.importCsv.addEventListener("click", () => dom.csvInput.click());

        dom.csvInput.addEventListener("change", (event) => {
          const file = event.target.files[0];
          if (!file) {
            return;
          }
          const confirmReplace = confirm(
            "Importing will replace the current board. Continue?"
          );
          if (!confirmReplace) {
            dom.csvInput.value = "";
            return;
          }

          Papa.parse(file, {
            header: true,
            skipEmptyLines: "greedy",
            transformHeader: (header) => header.trim().toLowerCase(),
            complete: (results) => {
              const errors = results.errors || [];
              const rows = results.data || [];
              if (!rows.length) {
                dispatch({
                  type: "SET_BANNER",
                  payload: "CSV import failed: empty file.",
                });
                return;
              }

              const required = ["name", "position", "team", "age", "byeweek"];
              const headers = results.meta.fields || [];
              const missing = required.filter((field) => !headers.includes(field));
              if (missing.length) {
                dispatch({
                  type: "SET_BANNER",
                  payload: `CSV import failed: missing columns (${missing.join(", ")}).`,
                });
                return;
              }

              const parsed = [];
              let skipped = 0;

              rows.forEach((row) => {
                const name = row.name ? String(row.name).trim() : "";
                const position = normalizePosition(row.position);
                const team = row.team ? String(row.team).trim() : "";
                const age = Number(row.age);
                const byeWeek = Number(row.byeweek);
                const importRank = Number(row.rank);

                if (!name || !team || Number.isNaN(age) || Number.isNaN(byeWeek)) {
                  skipped += 1;
                  return;
                }

                parsed.push({
                  id: `p-${Date.now()}-${Math.random().toString(16).slice(2)}`,
                  name,
                  team,
                  position,
                  age,
                  byeWeek,
                  starred: parseBoolean(row.starred),
                  note: row.note ? String(row.note) : "",
                  tiersAbove: parseBoolean(row.tiersabove),
                  importRank: Number.isNaN(importRank) ? null : importRank,
                });
              });

              if (!parsed.length) {
                dispatch({
                  type: "SET_BANNER",
                  payload: "CSV import failed: no valid rows.",
                });
                return;
              }

              if (errors.length || skipped) {
                dispatch({
                  type: "SET_BANNER",
                  payload: `CSV imported with warnings: ${errors.length} parse error(s), ${skipped} row(s) skipped.`,
                });
              } else {
                dispatch({ type: "SET_BANNER", payload: null });
              }

              const hasRank = parsed.every((player) => player.importRank !== null);
              const sorted = hasRank
                ? [...parsed].sort((a, b) => a.importRank - b.importRank)
                : parsed;
              const normalized = sorted.map((player, index) => {
                const { importRank, ...rest } = player;
                return { ...rest, rank: index + 1 };
              });
              dispatch({ type: "IMPORT_PLAYERS", payload: normalized });
              dom.csvInput.value = "";
              track("csv_import", { players: normalized.length });
            },
            error: () => {
              dispatch({
                type: "SET_BANNER",
                payload: "CSV import failed: unable to read file.",
              });
            },
          });
        });
      }
