      // === MODULE 11: ANALYTICS STUB ===
      // Pushes to dataLayer when an analytics snippet is installed (see the
      // ANALYTICS PLACEHOLDER in <head>); otherwise a silent no-op.
      function track(eventName, props) {
        try {
          if (Array.isArray(window.dataLayer)) {
            window.dataLayer.push({ event: eventName, ...props });
          }
        } catch (e) {}
      }

      // === MODULE 12: SHARE URL ===
      // The whole board rides in the URL fragment: compact rows -> JSON ->
      // gzip (CompressionStream) -> base64url. Fragments never hit a server,
      // so sharing stays zero-backend. Fallback for browsers without
      // CompressionStream: uncompressed base64url JSON (prefix marks which).
      const SHARE_VERSION = 1;

      function packBoardForShare() {
        return {
          v: SHARE_VERSION,
          players: APP_STATE.players.map((player) => [
            player.name,
            player.team,
            player.position,
            player.age,
            player.byeWeek,
            player.starred ? 1 : 0,
            player.note,
            player.tiersAbove ? 1 : 0,
          ]),
          tierLabels: APP_STATE.tierLabels,
        };
      }

      function unpackSharedBoard(payload) {
        if (!payload || payload.v !== SHARE_VERSION || !Array.isArray(payload.players)) {
          return null;
        }
        const players = payload.players.map((row, index) => ({
          id: `s${index + 1}`,
          rank: index + 1,
          name: String(row[0] ?? ""),
          team: String(row[1] ?? ""),
          position: normalizePosition(row[2]),
          age: Number(row[3]) || 0,
          byeWeek: Number(row[4]) || 0,
          starred: row[5] === 1,
          note: String(row[6] ?? ""),
          tiersAbove: row[7] === 1,
        })).filter((player) => player.name.length > 0);
        if (players.length === 0) {
          return null;
        }
        return {
          players,
          tierLabels: payload.tierLabels && typeof payload.tierLabels === "object" ? payload.tierLabels : {},
        };
      }

      function bytesToBase64Url(bytes) {
        let binary = "";
        for (let i = 0; i < bytes.length; i += 1) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }

      function base64UrlToBytes(encoded) {
        const base64 = encoded.replace(/-/g, "+").replace(/_/g, "/");
        const padded = base64 + "=".repeat((4 - (base64.length % 4)) % 4);
        const binary = atob(padded);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      async function encodeBoardToHash() {
        const json = JSON.stringify(packBoardForShare());
        const raw = new TextEncoder().encode(json);
        if (typeof CompressionStream === "function") {
          const stream = new Blob([raw]).stream().pipeThrough(new CompressionStream("gzip"));
          const compressed = new Uint8Array(await new Response(stream).arrayBuffer());
          return `#b=${bytesToBase64Url(compressed)}`;
        }
        return `#r=${bytesToBase64Url(raw)}`;
      }

      async function decodeBoardFromHash(hash) {
        try {
          if (hash.startsWith("#b=") && typeof DecompressionStream === "function") {
            const bytes = base64UrlToBytes(hash.slice(3));
            const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
            const json = await new Response(stream).text();
            return unpackSharedBoard(JSON.parse(json));
          }
          if (hash.startsWith("#r=")) {
            const json = new TextDecoder().decode(base64UrlToBytes(hash.slice(3)));
            return unpackSharedBoard(JSON.parse(json));
          }
        } catch (e) {}
        return null;
      }

      async function loadBoardFromLocation() {
        const shared = await decodeBoardFromHash(window.location.hash);
        if (!shared) {
          return false;
        }
        APP_STATE.players = normalizePlayers(shared.players);
        APP_STATE.tierLabels = shared.tierLabels;
        APP_STATE.history.undo = [];
        APP_STATE.history.redo = [];
        updateDirtyFlag(true);
        dispatch({
          type: "SET_BANNER",
          payload: "Viewing a shared board — it's yours to edit now.",
        });
        return true;
      }

      function initShare() {
        dom.share.addEventListener("click", async () => {
          const hash = await encodeBoardToHash();
          const url = `${window.location.origin}${window.location.pathname}${hash}`;
          try {
            await navigator.clipboard.writeText(url);
            showToast("Link copied — the whole board is in it");
          } catch (e) {
            window.prompt("Copy this link:", url);
          }
          track("share_url", { players: APP_STATE.players.length, bytes: url.length });
        });
      }

      // === MODULE 13: IMAGE EXPORT ===
      // Hand-drawn canvas render (no html2canvas): deterministic for a given
      // state, honors position colors and tier breaks, brands the footer.
      function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function exportImage() {
        const players = APP_STATE.players;
        const width = 800;
        const rowHeight = 30;
        const headerHeight = 72;
        const footerHeight = 44;
        const tierHeight = 26;
        const tierCount = players.filter((player) => player.tiersAbove).length;
        const height = headerHeight + players.length * rowHeight + tierCount * tierHeight + footerHeight;

        const canvas = document.createElement("canvas");
        const scale = 2;
        canvas.width = width * scale;
        canvas.height = height * scale;
        const ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);

        const positionVar = {
          QB: "--qb-full", RB: "--rb-full", WR: "--wr-full",
          TE: "--te-full", "D/ST": "--dst-full", K: "--k-full", UNK: "--unk-full",
        };

        ctx.fillStyle = cssVar("--bg") || "#0d1017";
        ctx.fillRect(0, 0, width, height);

        const title = document.getElementById("page-title")?.textContent || "Big Board";
        ctx.fillStyle = cssVar("--text") || "#edf1f7";
        ctx.font = "700 24px 'DM Sans', sans-serif";
        ctx.fillText(title, 24, 40);
        ctx.fillStyle = cssVar("--muted") || "#8a96b0";
        ctx.font = "400 12px 'DM Sans', sans-serif";
        ctx.fillText(new Date().toISOString().slice(0, 10), 24, 58);

        let y = headerHeight;
        let tierNumber = 1;
        players.forEach((player) => {
          if (player.tiersAbove) {
            tierNumber += 1;
            ctx.fillStyle = cssVar("--amber") || "#f59e0b";
            ctx.font = "600 12px 'DM Mono', monospace";
            const label = APP_STATE.tierLabels[player.id] || `TIER ${tierNumber}`;
            ctx.fillText(label.toUpperCase(), 24, y + 16);
            ctx.strokeStyle = cssVar("--amber") || "#f59e0b";
            ctx.globalAlpha = 0.45;
            ctx.beginPath();
            ctx.moveTo(24 + ctx.measureText(label.toUpperCase()).width + 12, y + 12);
            ctx.lineTo(width - 24, y + 12);
            ctx.stroke();
            ctx.globalAlpha = 1;
            y += tierHeight;
          }

          ctx.fillStyle = cssVar("--muted") || "#8a96b0";
          ctx.font = "500 13px 'DM Mono', monospace";
          ctx.textAlign = "right";
          ctx.fillText(String(player.rank), 52, y + 20);
          ctx.textAlign = "left";

          const positionColor = cssVar(positionVar[player.position] || "--unk-full") || "#94a3b8";
          ctx.fillStyle = positionColor;
          ctx.fillRect(64, y + 8, 4, 16);
          ctx.font = "600 11px 'DM Mono', monospace";
          ctx.fillText(player.position, 76, y + 20);

          ctx.fillStyle = cssVar("--text") || "#edf1f7";
          ctx.font = `${player.starred ? "700" : "500"} 14px 'DM Sans', sans-serif`;
          ctx.fillText(`${player.starred ? "★ " : ""}${player.name}`, 122, y + 20);

          ctx.fillStyle = cssVar("--muted") || "#8a96b0";
          ctx.font = "400 12px 'DM Mono', monospace";
          ctx.fillText(player.team || "", width - 80, y + 20);

          y += rowHeight;
        });

        ctx.fillStyle = cssVar("--muted") || "#8a96b0";
        ctx.font = "400 11px 'DM Sans', sans-serif";
        ctx.fillText("Made with Big Board — no sign-up drag-and-drop rankings", 24, height - 18);

        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "big-board.png";
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        }, "image/png");
        track("image_export", { players: players.length });
      }

      function initImageExport() {
        dom.image.addEventListener("click", exportImage);
      }

      // === MODULE 14: KEYBOARD REORDER ===
      // Space lifts the focused row, ArrowUp/Down moves it, Space drops,
      // Escape cancels. Moves mutate state directly (no history spam); the
      // single undo entry is written on drop against the pre-lift snapshot.
      const kbGrab = { id: null, originalPlayers: null };

      function announce(message) {
        dom.kbLive.textContent = message;
      }

      function focusRowById(id) {
        const row = dom.tableBody.querySelector(`tr.player-row[data-id="${id}"]`);
        if (row) {
          row.focus();
          row.classList.toggle("kb-lifted", kbGrab.id === id);
        }
      }

      function moveGrabbedRow(delta) {
        const players = [...APP_STATE.players];
        const fromIndex = players.findIndex((player) => player.id === kbGrab.id);
        const toIndex = fromIndex + delta;
        if (fromIndex === -1 || toIndex < 0 || toIndex >= players.length) {
          return;
        }
        const [moved] = players.splice(fromIndex, 1);
        players.splice(toIndex, 0, moved);
        APP_STATE.players = normalizePlayers(players);
        updateDirtyFlag();
        renderApp();
        focusRowById(kbGrab.id);
        announce(`${moved.name} moved to rank ${toIndex + 1} of ${players.length}`);
      }

      function initKeyboardReorder() {
        dom.tableBody.addEventListener("keydown", (event) => {
          const row = event.target.closest("tr.player-row");
          if (!row || isFilterActive() || isSortActive()) {
            return;
          }
          const id = row.dataset.id;
          const player = APP_STATE.players.find((candidate) => candidate.id === id);
          if (!player) {
            return;
          }

          if (event.key === " " || event.key === "Enter") {
            if (event.target !== row) {
              return; // let buttons inside the row keep their native behavior
            }
            event.preventDefault();
            if (kbGrab.id === id) {
              const finalPlayers = APP_STATE.players;
              APP_STATE.players = kbGrab.originalPlayers;
              kbGrab.id = null;
              kbGrab.originalPlayers = null;
              dispatch({ type: "REORDER", payload: finalPlayers });
              focusRowById(id);
              announce(`${player.name} dropped at rank ${finalPlayers.findIndex((candidate) => candidate.id === id) + 1}`);
            } else {
              kbGrab.id = id;
              kbGrab.originalPlayers = clonePlayers(APP_STATE.players);
              row.classList.add("kb-lifted");
              announce(`${player.name} lifted at rank ${player.rank}. Use arrow keys to move, Space to drop, Escape to cancel.`);
            }
            return;
          }

          if (kbGrab.id !== id) {
            return;
          }

          if (event.key === "ArrowUp" || event.key === "ArrowDown") {
            event.preventDefault();
            moveGrabbedRow(event.key === "ArrowUp" ? -1 : 1);
            return;
          }

          if (event.key === "Escape") {
            event.preventDefault();
            event.stopPropagation();
            APP_STATE.players = normalizePlayers(kbGrab.originalPlayers);
            kbGrab.id = null;
            kbGrab.originalPlayers = null;
            updateDirtyFlag();
            renderApp();
            focusRowById(id);
            announce(`Reorder cancelled. ${player.name} returned to rank ${player.rank}.`);
          }
        });
      }

      function initFiltersDrawer() {
        // Desktop keeps the filter row always-expanded (its toggle is
        // CSS-hidden there, see .filters-drawer > summary). Below 600px the
        // toggle appears and the drawer starts closed so the board isn't
        // pushed below the fold; a user's own open/close tap is left alone
        // after this point.
        if (window.matchMedia && window.matchMedia("(max-width: 600px)").matches) {
          dom.filtersDrawer.open = false;
        }
      }

      async function initializeApp() {
        initFiltersDrawer();
        // A shared-board URL wins over localStorage: the link IS the board.
        const loadedFromHash = await loadBoardFromLocation();
        if (!loadedFromHash) {
          try {
            const saved = localStorage.getItem("bb_saved_players");
            if (saved) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed) && parsed.length > 0) {
                APP_STATE.players = parsed;
              }
            }
          } catch (e) {}
          updateDirtyFlag(false);
        }
        renderApp();
        renderModal();
        initDragAndDrop();
        initKeyboardReorder();
        initUndoRedo();
        initFiltersAndSorting();
        initTierBreaks();
        initModal();
        initCsv();
        initAddRemove();
        initToolbar();
        initDraftedModule();
        initShare();
        initImageExport();
        attachGlobalRenders();
      }

      let _toastTimer = null;
      function showToast(message) {
        dom.saveToast.textContent = message;
        dom.saveToast.classList.add("visible");
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(() => dom.saveToast.classList.remove("visible"), 2000);
      }

      function showSaveToast() {
        showToast("Saved");
      }

      function autoSave() {
        if (!APP_STATE.isDirty) return;
        try {
          localStorage.setItem("bb_saved_players", JSON.stringify(APP_STATE.players));
          updateDirtyFlag(true);
          dom.dirtyIndicator.classList.remove("active");
          showSaveToast();
        } catch (e) {}
      }

      initializeApp().then(() => {
        document.documentElement.dataset.appReady = "true";
      });
      setInterval(autoSave, 30000);
    </script>
