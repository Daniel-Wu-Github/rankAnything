<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>This or that: {{TITLE}} — Rank Anything</title>
    <meta name="description" content="Rank {{TITLE}} by answering quick this-or-that questions. {{DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="This or that: {{TITLE}} — Rank Anything" />
    <meta property="og:description" content="Rank {{TITLE}} by answering quick this-or-that questions." />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta name="twitter:card" content="summary" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="/assets/css/app.css" />
    <!-- ANALYTICS PLACEHOLDER: replace with your GA/PostHog snippet -->
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <a class="wordmark" href="/"><span class="tick">▲</span> Rank Anything</a>
        <nav><a class="wordmark" href="{{BOARD_LINK}}">Board editor →</a></nav>
      </header>

      <h1 class="board-title" id="board-title">This or that</h1>
      <div class="sr-only" id="live-region" aria-live="polite" role="status"></div>

      <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="paste-actions">
        <span class="paste-hint" id="progress-text"></span>
        <button class="btn" id="undo-btn" disabled>Undo last choice</button>
      </div>

      <main id="duel-root"></main>

      <footer class="site-footer">
        <span>Every choice narrows the ranking — about n·log n picks total.</span>
        <a href="/">All templates</a>
      </footer>
    </div>

    <script type="application/json" id="template-data">{{TEMPLATE_JSON}}</script>
    <script type="module">
      import { bootSortApp } from "/assets/js/sort-app.js";
      bootSortApp();
    </script>
  </body>
</html>
